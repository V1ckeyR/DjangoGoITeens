{% extends 'base.html' %}
{% block content %}
<div class="d-flex">
    <h2>Профіль</h2>
    <a href="{% url 'edit_profile' %}">
        <i class="bi bi-pencil-square"></i> 
    </a>
</div>

{% if profile.avatar %}
    <p>Поточний аватар:</p>
    <img src="{{ profile.avatar.url }}" alt="Аватар" width="150">
{% else %}
    <p>Аватар не встановлено.</p>
{% endif %}

<p>Користувач: {{ user.username }}</p>
<p>Email: {{ user.email }}</p>
<a href="{% url 'password_change' %}">Змінити пароль</a>
{% for message in messages %}
<div class="alert alert-success">{{ message }}</div>
{% endfor %}
{% endblock %}

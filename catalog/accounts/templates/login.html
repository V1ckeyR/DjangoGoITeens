{% extends 'base.html' %}
{% block content %}
<h2>Вхід</h2>
{% if error %}
  <div class="alert alert-danger">{{ error }}</div>
{% endif %}
<form method="post">
  {% csrf_token %}
  <input type="text" name="username" placeholder="Ім’я" class="form-control mb-2">
  <input type="password" name="password" placeholder="Пароль" class="form-control mb-2">
  <button class="btn btn-primary">Увійти</button>
</form>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h2>Підтвердження email</h2>
{% if new_email %}
  <p>Адресу <strong>{{ new_email }}</strong> успішно підтверджено!</p>
  <p>Ваш email у профілі оновлено (старий: {{ old_email }}).</p>
  <a href="{% url 'profile' %}">Повернутися до профілю</a>
{% else %}
  <p>Щось пішло не так або посилання недійсне.</p>
{% endif %}
{% endblock %}

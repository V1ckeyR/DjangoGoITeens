<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column vh-100">
  <header>
    <nav class="navbar navbar-dark bg-dark navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Main</a>
        <a class="navbar-brand" href="{% url 'index' %}">Products</a>
  
        <ul class="navbar-nav ms-auto d-flex flex-row align-items-center">
          <li class="nav-item me-3">
            <select id="categoryFilter" class="form-select">
              <option value="">Категорія</option>
              <!-- JavaScript сам вставить категорії -->
            </select>
          </li>
          <li class="nav-item me-3">
            <select id="sortSelect" class="form-select">
              <option value="">Сортувати</option>
              <option value="price">Ціна: від дешевих</option>
              <option value="-price">Ціна: від дорогих</option>
              <option value="-rating">Рейтинг</option>
            </select>
          </li>
        </ul>
  
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
              <li class="nav-item">
                <span class="nav-link">Привіт, {{ user.username }}!</span>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'profile' %}">Профіль</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'logout' %}">Вийти</a>
              </li>
            {% else %}
              <li class="nav-item">
                <a class="nav-link" href="{% url 'login' %}">Увійти</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'register' %}">Зареєструватися</a>
              </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-3 flex-shrink-0">
      {{ request.messages }}
      {% block content %} {% endblock %}
  </main>
  
  <footer class="footer mt-auto py-3 px-2 bg-light">
      <a class="navbar-brand" href="{% url 'about' %}">About Us</a>
  </footer>
</body>
</html>
